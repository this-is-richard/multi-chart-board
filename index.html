<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi Chart Board</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <h1>Multi Chart Board</h1>
      <p class="hint">TradingView widgets · 1–8 charts · 50 &amp; 200 SMA</p>
    </div>

    <div class="controls">
      <label class="field">
        <span>Charts</span>
        <select id="chartCount">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </label>

      <label class="field">
        <span>Interval</span>
        <select id="interval">
          <option value="1">1m</option>
          <option value="5">5m</option>
          <option value="15">15m</option>
          <option value="60">1h</option>
          <option value="240">4h</option>
          <option value="D" selected>1D</option>
          <option value="W">1W</option>
        </select>
      </label>

      <label class="field">
        <span>Theme</span>
        <select id="theme">
          <option value="dark" selected>Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <button id="applyBtn" type="button">Apply</button>
    </div>
  </header>

  <section class="tickers-bar" aria-label="Tickers">
    <label class="field tickers-field" for="tickersInput">
      <span>Tickers</span>
      <input
        id="tickersInput"
        type="text"
        placeholder="NVDA, MU, AVGO"
        autocomplete="off"
        spellcheck="false"
      />
    </label>
    <p class="tickers-hint">Comma or space separated · US stocks ok without exchange</p>
    <p class="resolved-line" id="resolvedLine" aria-live="polite"></p>
    <p class="status-line" id="statusLine" aria-live="polite"></p>
  </section>

  <main class="grid" id="chartGrid" aria-live="polite"></main>

  <script src="app.js"></script>
</body>
</html>
